name: release
# Cutting a release is a deliberate act, so this workflow is dispatch only. It
# always operates on the head of `main`, whatever ref it is dispatched from, so
# that a release is always "what main is right now".
#
# Why tags at all: consumers pin `uses: terrateamio/action@<ref>`. Dependabot
# compares that ref against this repository's TAGS. Before these tags existed
# there was nothing to compare against and no consumer was ever told to upgrade.
# A consumer pinned to a commit SHA is the case that was completely inert: the
# update checker gives up immediately when the repository has no tags.
#
# `v1` is a legacy BRANCH and is being deprecated. Do not create a tag named v1
# while the branch exists: a branch and a tag of the same name make `@v1`
# resolve ambiguously. The moving tag this workflow publishes is an IMAGE tag,
# not a git tag.
#
# A release commits the FIPS image pin and tags that commit. The commit is NOT
# pushed to `main`: a repository ruleset requires a pull request for `main`, so
# a direct push is rejected. The tag carries the commit instead, so the release
# needs no write access to any branch.
#
# A stable release then opens a pull request that lands the same pin on `main`.
# Dependabot moves a SHA pin that carries no tag to the HEAD OF MAIN, never to a
# release commit, so most SHA-pinned consumers live on `main` commits. `main`
# therefore has to name an immutable image too. It trails the newest release
# until that pull request merges, which is the point of the fips-pin check.
on:
  workflow_dispatch:
    inputs:
      release_kind:
        description: 'Semver bump (specific uses the semver_tag field below)'
        required: true
        type: choice
        default: specific
        options:
          - specific
          - major
          - minor
          - patch
      semver_tag:
        description: 'Exact tag (e.g. v1.4.0 or v1.4.0-rc.1). Only used when release_kind is "specific"'
        required: false
        type: string
      dry_run:
        description: 'Build everything, publish nothing.'
        required: false
        default: false
        type: boolean
permissions:
  contents: write
  packages: write
  pull-requests: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      -
        # Always main, never the dispatched ref. This also means
        # scripts/next_semver is read from main, so the script has to be merged
        # there before it is used. fetch-depth 0 brings the tags down with the
        # history, which is what next_semver reads.
        name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      -
        # Computes the version, refuses to reuse a tag, and reports the previous
        # stable tag. All three answers come from the same tag list.
        name: Compute the version
        id: version
        env:
          RELEASE_KIND: ${{ inputs.release_kind }}
          SEMVER_TAG: ${{ inputs.semver_tag }}
        run: ./scripts/next_semver
      -
        # Composed here rather than inline in `tags:`, so that the prerelease
        # case drops the moving-tag line outright instead of leaving a blank one.
        # The moving tag follows the version being released, so a v2.0.0 release
        # moves :v2 and leaves :v1 pointing at the last v1 release.
        name: Compose the image tags
        id: tags
        env:
          VERSION: ${{ steps.version.outputs.semver_tag }}
          MAJOR_TAG: ${{ steps.version.outputs.major_tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          emit () {
            local name="$1" image="$2"
            {
              echo "${name}<<TAGS_EOF"
              echo "${image}:${VERSION}"
              # A prerelease must not move the tag that consumers follow.
              if [ "${IS_PRERELEASE}" != 'true' ]; then
                echo "${image}:${MAJOR_TAG}"
              fi
              echo TAGS_EOF
            } >> "$GITHUB_OUTPUT"
          }
          emit action ghcr.io/terrateamio/action
          emit action_fips ghcr.io/terrateamio/action-fips
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push action
        uses: docker/build-push-action@v7
        with:
          push: ${{ !inputs.dry_run }}
          file: Dockerfile
          tags: ${{ steps.tags.outputs.action }}
          platforms: linux/amd64,linux/arm64
      -
        name: Build and push fips action
        id: build_fips
        uses: docker/build-push-action@v7
        with:
          push: ${{ !inputs.dry_run }}
          file: Dockerfile.fips
          tags: ${{ steps.tags.outputs.action_fips }}
          platforms: linux/amd64,linux/arm64
      -
        # fips/action.yml runs a PREBUILT image, so a ref pin only freezes the
        # FIPS action if the reference in the file is immutable. This edit stays
        # in the working tree and is committed to the release commit only, which
        # is what makes `@v1.4.0` and a SHA pin mean the same thing for FIPS as
        # they do for the main action. The copy on main stays movable.
        name: Pin the fips action to this release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.semver_tag }}
          DIGEST: ${{ steps.build_fips.outputs.digest }}
        run: |
          set -euo pipefail
          test -n "${DIGEST}"
          REF="docker://ghcr.io/terrateamio/action-fips:${VERSION}@${DIGEST}"
          sed -i -E "s|^(  image: ')docker://ghcr\.io/terrateamio/action-fips:[^']*(')\$|\1${REF}\2|" fips/action.yml
          # A sed that matched nothing is silent, so check the result.
          grep -qF "image: '${REF}'" fips/action.yml
      -
        # After the images, so that a failed build leaves no tag behind and the
        # release can be retried with the same number.
        #
        # Only the tag is pushed. Pushing a tag carries the commit it points at,
        # so the release commit lands without a branch update. Its parent is the
        # head of main that was built, so `git tag --contains <sha>` still says
        # which release carries a given commit.
        #
        # main keeps the moving `action-fips:vN` reference. A consumer who pins
        # a main commit therefore runs the newest release of that line. Only a
        # release tag, or the commit it points at, freezes the FIPS image. A
        # prerelease needs no special case, because main is never written to.
        name: Tag the release
        id: tag
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.semver_tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # `committed` tells the pull request step below whether there is
          # anything to propose. A re-run over an unchanged pin has nothing.
          if git diff --quiet -- fips/action.yml; then
            echo 'fips/action.yml already carries this pin'
            echo 'committed=false' >> "$GITHUB_OUTPUT"
          else
            git add fips/action.yml
            git commit -m "Release ${VERSION}"
            echo 'committed=true' >> "$GITHUB_OUTPUT"
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "refs/tags/${VERSION}"
      -
        name: Create the GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          VERSION: ${{ steps.version.outputs.semver_tag }}
          IS_PRERELEASE: ${{ steps.version.outputs.is_prerelease }}
          PREV: ${{ steps.version.outputs.prev_stable_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # PREV is the previous STABLE tag, so a release that follows a
          # prerelease still describes everything since the last thing users
          # actually got. It is empty for the first release.
          ARGS=(--verify-tag --title "${VERSION}" --generate-notes)
          if [ -n "${PREV}" ]; then
            ARGS+=(--notes-start-tag "${PREV}")
          fi
          if [ "${IS_PRERELEASE}" = 'true' ]; then
            ARGS+=(--prerelease)
          else
            ARGS+=(--latest)
          fi
          gh release create "${VERSION}" "${ARGS[@]}"
      -
        # The branch is the release commit itself, so the pull request carries
        # exactly the line the tag carries. A prerelease is skipped, because
        # main must never name an rc image.
        #
        # Known wrinkle: a pull request opened with GITHUB_TOKEN does not start
        # other workflows, so ci and fips-pin do not run on it. Close and reopen
        # it if a required check blocks the merge.
        name: Open the pull request that pins main
        if: ${{ !inputs.dry_run && steps.version.outputs.is_prerelease != 'true' && steps.tag.outputs.committed == 'true' }}
        env:
          VERSION: ${{ steps.version.outputs.semver_tag }}
          DIGEST: ${{ steps.build_fips.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="pin-fips-${VERSION}"
          git push origin "HEAD:refs/heads/${BRANCH}"
          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "Pin the fips action to ${VERSION}" \
            --body "Release ${VERSION} published \`ghcr.io/terrateamio/action-fips:${VERSION}@${DIGEST}\`.

          This lands the same reference on \`main\`. Until it merges, a consumer
          who pins a \`main\` commit runs the previous release's FIPS image.

          The tag \`${VERSION}\` already carries this commit. Merging changes
          nothing that consumers of the tag can see."

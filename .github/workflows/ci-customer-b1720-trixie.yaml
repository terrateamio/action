name: ci-customer-b1720-trixie
#
# Mirror of ci.yaml for the customer-b1720 branch: every merge to
# customer-b1720-trixie builds and pushes the action image. The image is
# tagged after the branch because it is not v1.
on:
  push:
    branches:
      - 'customer-b1720-trixie'
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      -
        name: Build and push action
        uses: docker/build-push-action@v6
        with:
          push: true
          file: Dockerfile
          tags: ghcr.io/terrateamio/action:customer-b1720-trixie
          platforms: linux/amd64,linux/arm64

name: fips-pin
# Guards the FIPS base image reference in Dockerfile.fips.
#
# The base image is the FIPS-specific artefact: Wolfi plus OpenSSL compiled in
# FIPS mode. The base-fips workflow builds it on demand and tags it with a Unix
# timestamp. Dockerfile.fips is the only place that records which build the
# action uses.
#
# The action images are not checked here. Their digests are published to users
# when they pull the image, and nothing in this repository encodes them.
#
# Two severities, on purpose:
#   error  - the reference has no digest, or its tag and digest disagree.
#   notice - a newer base build exists. Moving to it is a decision, so this
#            never fails. On a pull request it becomes a comment.
on:
  pull_request:
  push:
    branches:
      - 'main'
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: fips-pin-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
      -
        # Fails only on a missing digest or a tag that contradicts the digest.
        name: Check the fips base pin
        id: pin
        run: ./scripts/check_fips_base_pin
      -
        name: Report
        if: ${{ always() && steps.pin.outcome == 'success' }}
        env:
          PINNED_REF: ${{ steps.pin.outputs.pinned_ref }}
          LATEST_REF: ${{ steps.pin.outputs.latest_ref }}
          STALE: ${{ steps.pin.outputs.stale }}
        run: |
          set -euo pipefail
          {
            echo '### FIPS base image pin'
            echo
            echo '```'
            echo "${PINNED_REF}"
            echo '```'
            if [ "${STALE}" = 'true' ]; then
              echo 'A newer base build exists:'
              echo
              echo '```'
              echo "${LATEST_REF}"
              echo '```'
            else
              echo 'This is the newest base build.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${STALE}" = 'true' ]; then
            echo "::notice title=A newer FIPS base build exists::${LATEST_REF}"
          fi
      -
        # A fork pull request gets a read-only token, so this cannot be allowed
        # to fail the check. The comment is informational either way.
        name: Comment on the pull request
        if: ${{ github.event_name == 'pull_request' && steps.pin.outcome == 'success' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          PINNED_REF: ${{ steps.pin.outputs.pinned_ref }}
          LATEST_REF: ${{ steps.pin.outputs.latest_ref }}
          STALE: ${{ steps.pin.outputs.stale }}
        run: |
          set -euo pipefail
          MARKER='<!-- fips-pin-check -->'
          # One comment, edited in place, so a long-lived branch does not collect
          # a new one on every push.
          ID=$(gh api "repos/${REPO}/issues/${PR}/comments" --paginate \
               --jq "map(select(.body | contains(\"${MARKER}\"))) | .[0].id // empty")
          if [ "${STALE}" != 'true' ]; then
            if [ -n "${ID}" ]; then
              gh api --method DELETE "repos/${REPO}/issues/comments/${ID}"
              echo 'Removed the stale-pin comment.'
            else
              echo 'Pin is current, nothing to say.'
            fi
            exit 0
          fi
          BODY=$(cat <<COMMENT
          ${MARKER}
          **A newer FIPS base image exists.** This does not block the pull request.

          \`Dockerfile.fips\` pins:

          \`\`\`
          ${PINNED_REF}
          \`\`\`

          The newest base build is:

          \`\`\`
          ${LATEST_REF}
          \`\`\`

          Moving to it is a decision, not an obligation. To take it, replace the
          whole \`ARG BASE_IMAGE=\` line with the second reference above.
          COMMENT
          )
          if [ -n "${ID}" ]; then
            gh api --method PATCH "repos/${REPO}/issues/comments/${ID}" -f body="${BODY}" > /dev/null
            echo 'Updated the existing comment.'
          else
            gh api --method POST "repos/${REPO}/issues/${PR}/comments" -f body="${BODY}" > /dev/null
            echo 'Posted a comment.'
          fi
